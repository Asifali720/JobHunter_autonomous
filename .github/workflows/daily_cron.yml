name: JobHunter Autonomous Daily Automation

on:
  schedule:
    # Cron Timing: Subah 9:00 AM Pakistan Time (PKT)
    # Note: GitHub UTC time use karta hai (9:00 AM PKT = 4:00 AM UTC)
    - cron: '9 15 * * *'
  workflow_dispatch: # Is line se aap GitHub UI se Manual 'Run' bhi kar sakte hain

jobs:
  run-jobhunter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Run JobHunter Script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ULTRAMSG_INSTANCE_ID: ${{ secrets.ULTRAMSG_INSTANCE_ID }}
          ULTRAMSG_TOKEN: ${{ secrets.ULTRAMSG_TOKEN }}
          MY_PHONE_NUMBER: ${{ secrets.MY_PHONE_NUMBER }}
          LINKEDIN_LI_AT_COOKIE: ${{ secrets.LINKEDIN_LI_AT_COOKIE }}
        run: |
          python3 app.py